services:
  wan:
    image: ${DOCKERHUB_USERNAME:-wan}/wan:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DOWNLOAD_URL: ${DOWNLOAD_URL:-http://127.0.0.1/}
      MODEL_SOURCE: ${MODEL_SOURCE:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      MODELSCOPE_TOKEN: ${MODELSCOPE_TOKEN:-}
    volumes:
      - ../Wan2.2-TI2V-5B:/app/Wan2.2-TI2V-5B
      - ../output:/app/output
    gpus: all
    shm_size: 16gb
    restart: unless-stopped
